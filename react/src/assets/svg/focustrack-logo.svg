<svg xmlns="http://www.w3.org/2000/svg" width="320" height="80" viewBox="0 0 320 80" role="img" aria-label="FocusTrack logo">
  <!-- Icon -->
  <g transform="translate(18,18)">
    <!-- Top bar -->
    <rect x="10" y="-8" width="44" height="14" rx="7" fill="#8DBFFF"/>

    <!-- Middle left (gold) -->
    <rect x="0" y="10" width="30" height="14" rx="7" fill="#D1BD69"/>

    <!-- Middle right (blue) – shortened to form an F -->
    <rect x="18" y="10" width="26" height="14" rx="7" fill="#7AB7E8"/>

    <!-- Vertical stem (gold) -->
    <rect x="18" y="20" width="14" height="28" rx="7" fill="#C9B15E"/>
  </g>

  <!-- Wordmark -->
  <text x="92" y="50"
        font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
        font-size="34"
        font-weight="600"
        fill="#DDDDDD"
        letter-spacing="0.2">
    FocusTrack
  </text>
</svg>
